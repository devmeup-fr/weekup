// AGP et KGP sont déclarés dans le bloc plugins de settings.gradle : un
// buildscript avec le classpath d'AGP entre en conflit avec AGP 9.

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Project.buildDir est déprécié (Gradle 9) : layout.buildDirectory.
def newBuildDir = rootProject.layout.projectDirectory.dir("../build")
rootProject.layout.buildDirectory.value(newBuildDir)
subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
// shortcut: volume_controller 2 compile en API 31, alors que les AndroidX
// récents exigent au moins 34. À retirer avec alarm 5 + volume_controller 3.
subprojects {
    afterEvaluate { project ->
        if (project.name == "volume_controller") {
            project.android.compileSdkVersion 36
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
